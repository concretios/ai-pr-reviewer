name: AI Review Request
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '@dr-concretio review' ||
       github.event.comment.body == '@dr-concretio extend')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-${{ github.repository_id }}-${{ github.event.issue.number }}-publish
      cancel-in-progress: false
      queue: max
    steps:
      # Replace with the same audited v2 release SHA as the automatic workflow.
      - uses: concretios/ai-pr-reviewer@v2
        id: review
        with:
          github_token: ${{ github.token }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          pr_number: ${{ github.event.issue.number }}
          bot_name: dr-concretio
          publish: 'true'
      - uses: actions/upload-artifact@v7
        if: always() && steps.review.outputs.report_directory != ''
        with:
          name: ai-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.review.outputs.report_directory }}
          retention-days: 7
