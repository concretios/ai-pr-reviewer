name: 'Dr. Concret.io: AI PR Reviewer'
description: 'Advisory Gemini reviews with immutable source, bounded coverage, and persistent findings.'
author: Concret.io
branding:
  icon: activity
  color: blue
inputs:
  gemini_api_key:
    description: Gemini API key
    required: true
  github_token:
    description: Token for repository reads and advisory PR comments
    default: ${{ github.token }}
  pr_number:
    description: Explicit PR number for manual runs
  config_path:
    description: Configuration file read from the captured base revision
    default: .ai-review.yml
  review_mode:
    description: auto or extended; extended requires a maintainer request
    default: auto
  publish:
    description: Publish advisory findings to the PR
    default: 'true'
  model:
    description: Gemini model; engine default gemini-2.5-flash
  rules_paths:
    description: Ordered comma-separated base-revision Markdown files or directories, globally scoped
  post_inline_comments:
    description: Post eligible inline concerns; all concerns also persist in required detail pages
  comment_severity_threshold:
    description: Minimum inline severity, critical/high/medium/low; engine default low
  bot_name:
    description: Stable reviewer identity across triggers; engine default dr-concretio
  submit_review_verdict:
    description: Migration compatibility only; false accepted, true rejected
  max_files:
    description: Removed in v2; supplying this input produces migration guidance
  max_diff_size:
    description: Removed in v2; supplying this input produces migration guidance
  context_depth:
    description: Removed in v2; bounded adaptive context replaces this setting
outputs:
  review_status:
    description: complete, partial, unavailable, skipped, or superseded
  publication_status:
    description: published, partial, failed, uncertain, or not_requested
  reviewed_sha:
    description: Captured PR head commit
  report_directory:
    description: Local report directory for artifact upload
runs:
  using: node24
  main: dist/index.js
